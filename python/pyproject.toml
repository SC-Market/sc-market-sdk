[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sc-market-sdk"
version = "0.1.1"
description = "Typed client for the SC Market public API and public price feed (Star Citizen player marketplace)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = []
keywords = ["star-citizen", "sc-market", "api", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sc-market.space/developers"
Source = "https://github.com/SC-Market/sc-market-sdk"
Issues = "https://github.com/SC-Market/sc-market-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sc_market_sdk"]
exclude = ["**/._*"]

[tool.hatch.build.targets.sdist]
include = ["src/sc_market_sdk", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/._*"]
